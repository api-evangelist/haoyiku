name: haoyiku
description: >-
  Haoyiku (好衣库) is a Chinese private-domain social e-commerce and brand flash-sale
  platform operated by Haoyiku (Hangzhou) Intelligent Technology Co., Ltd. and
  associated with Jingling Group, founded in December 2017. It equips millions of
  individual store owners with a one-click storefront, dropship supply chain, private-domain
  traffic tooling, operations training, and after-sales services, spanning apparel,
  footwear, bags, cosmetics, personal care, mother-and-baby, and daily-necessities
  categories across more than 15,000 brand partnerships. Surfaced as a portfolio
  company of Qiming Venture Partners, Haoyiku is a consumer mobile-app business with
  no public developer platform or API program; this profile captures its identity and
  domain-security posture within the API Evangelist network.
